[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-mcp-server"
version = "0.2.0"
description = "Microsoft Teams MCP server with dual-mode: Native (Graph API) + Persona (browser guest join)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "cryptography>=42.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]
whisper = [
  "faster-whisper>=1.0",
]
deepgram = [
  "websockets>=12.0",
]
azure_speech = [
  "azure-cognitiveservices-speech>=1.37",
]
stt = [
  "teams-mcp-server[whisper,deepgram,azure_speech]",
]
persona = [
  "playwright>=1.40",
  "opencv-python-headless>=4.9",
  "piper-tts>=1.2.0",
]
all = [
  "teams-mcp-server[stt,persona]",
]

[project.scripts]
teams-mcp = "teams_mcp.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
