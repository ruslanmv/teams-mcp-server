[project]
name = "teams-mcp-server"
version = "0.1.0"
description = "Microsoft Teams MCP server (HomePilot-compatible) via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "cryptography>=42.0",
  "python-dateutil>=2.9",
]

[project.scripts]
teams-mcp = "teams_mcp.main:run"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
