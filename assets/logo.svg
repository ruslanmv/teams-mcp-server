<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6264A7"/>
      <stop offset="50%" style="stop-color:#7B83EB"/>
      <stop offset="100%" style="stop-color:#505AC9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B83EB;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7B83EB;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6264A7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="16" fill="url(#bg)"/>

  <!-- Subtle glow behind icon -->
  <circle cx="60" cy="60" r="40" fill="url(#glow)"/>

  <!-- Teams icon hexagon -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Shield shape -->
    <path d="M-22 -26 L22 -26 L28 -8 L0 30 L-28 -8 Z" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1.5"/>

    <!-- Teams T -->
    <rect x="-14" y="-18" width="28" height="6" rx="2" fill="url(#accent)"/>
    <rect x="-3" y="-18" width="6" height="30" rx="2" fill="url(#accent)"/>

    <!-- People silhouettes -->
    <circle cx="-20" cy="2" r="4" fill="#7B83EB" opacity="0.7"/>
    <circle cx="20" cy="2" r="4" fill="#7B83EB" opacity="0.7"/>
    <ellipse cx="-20" cy="12" rx="5" ry="3" fill="#7B83EB" opacity="0.5"/>
    <ellipse cx="20" cy="12" rx="5" ry="3" fill="#7B83EB" opacity="0.5"/>

    <!-- MCP protocol dots -->
    <circle cx="-24" cy="-22" r="2.5" fill="#4FD1C5" opacity="0.9"/>
    <circle cx="24" cy="-22" r="2.5" fill="#4FD1C5" opacity="0.9"/>
    <circle cx="0" cy="26" r="2.5" fill="#4FD1C5" opacity="0.9"/>

    <!-- Connection lines -->
    <line x1="-22" y1="-21" x2="-14" y2="-15" stroke="#4FD1C5" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="-21" x2="14" y2="-15" stroke="#4FD1C5" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="24" x2="0" y2="16" stroke="#4FD1C5" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Text: Teams MCP Server -->
  <text x="105" y="48" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="0.5">Teams MCP Server</text>

  <!-- Subtitle -->
  <text x="105" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#8892b0" letter-spacing="1">MICROSOFT TEAMS · MODEL CONTEXT PROTOCOL</text>

  <!-- Version badge -->
  <g transform="translate(105, 82)">
    <rect width="58" height="18" rx="9" fill="#6264A7" opacity="0.2" stroke="#6264A7" stroke-width="0.5"/>
    <text x="29" y="13" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#7B83EB" text-anchor="middle">v0.2.0</text>
  </g>

  <!-- Tool count badge -->
  <g transform="translate(170, 82)">
    <rect width="64" height="18" rx="9" fill="#4FD1C5" opacity="0.15" stroke="#4FD1C5" stroke-width="0.5"/>
    <text x="32" y="13" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#4FD1C5" text-anchor="middle">35 tools</text>
  </g>

  <!-- Dual mode badge -->
  <g transform="translate(241, 82)">
    <rect width="76" height="18" rx="9" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="0.5"/>
    <text x="38" y="13" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#F59E0B" text-anchor="middle">dual mode</text>
  </g>
</svg>
